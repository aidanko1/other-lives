name: Deploy Other Lives to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [[ -f "Other-Lives-v5.6-Researched-Countries.zip" ]]; then
            unzip -oq "Other-Lives-v5.6-Researched-Countries.zip" -d _site
            test -s _site/index.html
            test -s _site/evidence-depth.js
            grep -q 'evidence-depth.js' _site/index.html
            echo "5.6.0" > _site/release-version.txt
          else
            cp index.html world-countries.js world-simulation.js culture-economy.js age-culture-audit.js life-depth.js sw.js _site/
            test -s _site/index.html
            echo "5.5.0" > _site/release-version.txt
          fi
          cp manifest.webmanifest _site/
          if [[ -d icons ]]; then cp -R icons _site/icons; fi
          if [[ -f icon.svg ]]; then cp icon.svg _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
