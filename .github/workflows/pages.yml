name: Deploy Other Lives to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          node --check life-clarity.js
          node --check life-experience.js
          node --check pixel-household.js
          node --check life-evidence.js
          node --check life-dynamics.js
          node --check life-moments.js
          node --check life-relationships.js
          node --check life-university.js
          node --check life-memory-voice.js
          node tests/life-clarity.test.cjs --quick
          node tests/birth-reveal.test.cjs
          node tests/life-dynamics.test.cjs
          node tests/memory-voice.test.cjs
          node tests/university.test.cjs
          cp index.html world-countries.js world-simulation.js culture-economy.js age-culture-audit.js life-depth.js life-clarity.js life-clarity.css life-experience.js life-experience.css pixel-household.js life-evidence.js life-dynamics.js life-dynamics.css life-moments.js life-relationships.js life-university.js life-memory-voice.js sw.js _site/
          test -s _site/index.html
          cp release-version.txt _site/
          cp manifest.webmanifest _site/
          if [[ -d icons ]]; then cp -R icons _site/icons; fi
          if [[ -f icon.svg ]]; then cp icon.svg _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
