name: Deploy Other Lives to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble v5.2 static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html world-countries.js world-simulation.js culture-economy.js _site/
          cp sw.js manifest.webmanifest _site/
          if [[ -d icons ]]; then cp -R icons _site/icons; fi
          if [[ -f icon.svg ]]; then cp icon.svg _site/; fi
          echo "5.2.0" > _site/release-version.txt
          test -s _site/index.html
          test -s _site/culture-economy.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
