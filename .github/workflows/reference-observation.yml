name: Reference UX observation (research only)
on:
  push:
    branches: ['engineering/**']
    paths: ['scripts/reference-observation.cjs', '.github/workflows/reference-observation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/reference-observation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-observation
          path: test-results/
