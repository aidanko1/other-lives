/* PWA safe-area support for modern iPhones, without changing text-based gameplay. */
@supports (padding: max(0px)) {
  .app-shell { padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(42px, env(safe-area-inset-bottom)); }
  .toast { bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px)); }
}

/* v2 — simple text-led automatic timeline */
.life-controls{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px 16px;margin:0 0 18px;border:1px solid #dce5dc;border-radius:14px;background:#f4f8f2f5;box-shadow:0 10px 25px #273e3220;backdrop-filter:blur(10px)}
.speed-caption{color:var(--muted);font-size:11px;font-weight:700;margin-left:2px}
.speed-list{display:flex;align-items:center;background:#e8eee8;border-radius:9px;padding:3px;gap:1px}
.speed-btn{font-size:12px;font-weight:750;border:0;background:transparent;color:#65756c;padding:8px 9px;border-radius:7px;min-width:35px}
.speed-btn.selected{color:#fff;background:#396d60;box-shadow:0 2px 7px #264b4028}

.decision-popup .event-copy{line-height:1.75;margin-bottom:19px}
.decision-popup .choice{padding:16px 17px}
.decision-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.decision-tag{font-size:10px;color:#916642;background:#fbefe1;border-radius:30px;padding:7px 9px;font-weight:800;white-space:nowrap;letter-spacing:.3px}

O.chooseEvent=(s)=>{
 const milestones=ev.filter(e=>e.milestone&&s.age>=e.min&&s.age<=e.max&&e.when(s));
 if(milestones.length)return milestones[0];
 const options=ev.filter(e=>!e.milestone&&s.age>=e.min&&s.age<=e.max&&e.when(s)&&(s.used[e.id]===undefined||s.age-s.used[e.id]>=7));
 if(!options.length)return null;
 return O.weighted(s,options,e=>e.weight*(e.category==='Hard choices'&&at(s)<=1?1.6:1));

/* v2.4: continuous month-by-month clock; each year has 2–5 highlights,

(function(O){
const originalCreate=O.create;
O.ensureTimeline=function(s){
 if(typeof s.month!=='number')s.month=0;
  if(O.upgradeLife)O.upgradeLife(s);
 if(!s.storyUsed)s.storyUsed={};
 if(!Array.isArray(s.agenda))s.agenda=O.makeAgenda(s);

};
O.create=function(settings){const s=originalCreate(settings);O.ensureTimeline(s);return s;};
O.makeAgenda=function(s){
 const milestone=O.EVENTS.find(e=>e.milestone&&e.min===s.age&&e.when(s)&&s.used[e.id]===undefined);
 let decisionList=[];
 const chance=s.age<5?.025:s.age<12?.20:s.age<18?.43:s.age<30?.55:s.age<60?.48:s.age<80?.38:.26;
 if(milestone)decisionList.push(milestone.id);
 else if(O.chance(s,chance)){
  const ev=O.chooseEvent(s);if(ev)decisionList.push(ev.id);
 }
 if(s.age>=16&&s.age<=70&&O.chance(s,.095)&&decisionList.length){
  const ex=new Set(decisionList);
  let pool=O.EVENTS.filter(e=>!e.milestone&&e.min<=s.age&&e.max>=s.age&&e.when(s)&&!ex.has(e.id)&&(s.used[e.id]===undefined||s.age-s.used[e.id]>=7));
  if(pool.length)decisionList.push(O.weighted(s,pool,e=>e.weight).id);
 }
 const total=O.weighted(s,[2,3,4,5],n=>({2:20,3:37,4:29,5:14})[n]);
 const narrativeCount=Math.max(0,total-decisionList.length);
 const stories=O.pickStories(s,narrativeCount);
 let slots=[];
 // Month 1-11, so birthdays and recorded events don't collide at the boundary.
 while(slots.length<stories.length+decisionList.length){const m=O.int(s,1,11);if(!slots.includes(m))slots.push(m)}
 slots.sort((a,b)=>a-b);
 const all=[...stories.map(x=>({...x,type:'story'})),...decisionList.map(id=>({type:'decision',id}))];
 // Interleave story and decision, keeping both types independent of the yearly age increment.
 all.sort(()=>O.rand(s)-.5);
 return all.map((x,i)=>({...x,month:slots[i],done:false})).sort((a,b)=>a.month-b.month);
};
O.advanceMonth=function(s){
 if(!s||s.status!=='alive'||s.pending)return {advanced:false,decision:!!s?.pending};
 O.ensureTimeline(s);
 // First process anything at the current position not yet processed.
 const due=s.agenda.find(a=>a.month<=s.month&&!a.done);
 if(due){
  due.done=true;
  if(due.type==='story')O.fireStory(s,due);
  else{
   const e=O.EVENTS.find(x=>x.id===due.id);
   if(e&&e.when(s)&&s.age>=e.min&&s.age<=e.max){s.pending=e.id;s.scene=e.scene||s.scene;O.snapshot(s)}
   else O.journal(s,'Plans change','An expected opportunity does not materialise as circumstances shift.','life');
  }
  return {advanced:true,decision:!!s.pending,entry:true};
 }
 if(s.month<11){s.month++;s.lastOutcome='';return {advanced:true};}
 s.age++;s.month=0;s.lastOutcome='';
 O.passive(s);
 if(O.mortality(s)){O.finish(s);return {advanced:true,finished:true,birthday:true};}
 O.snapshot(s);
 s.agenda=O.makeAgenda(s);
 return {advanced:true,birthday:true};
};
O.advance=function(s){ // Legacy compatibility; advance to the next birthday or decision.
 if(!s||s.pending||s.status!=='alive')return false;
 const start=s.age;
 for(let i=0;i<22&&s.status==='alive'&&!s.pending&&s.age===start;i++)O.advanceMonth(s);

};
O.skipToDecision=function(s){
 if(!s||s.status!=='alive'||s.pending)return 0;
 let months=0;
 while(s.status==='alive'&&!s.pending&&months<1500){
  const before=s.month,age=s.age;
  O.advanceMonth(s);if(s.month!==before||s.age!==age)months++;
 }

};

O.create=function(settings){

 s.flags.familyTradition=c.name;
 // Household money separate from long-term assets, keeping expensive items inaccessible.
 s.familyCash=Math.max(10,Math.round(s.familyIncome*(s.strata<=1?.07:s.strata<=3?.16:.24)*(0.6+O.rand(s)*.9)));

function cashPool(s){return s.age<18?num(s.familyCash,0):num(s.cash,0)}

 cheap('social','A meal or afternoon with loved ones',`Spend time with ${names(s)} or neighbours.`,.003,{happiness:3,relationships:3},'Relationships'),

 ];
 // Stage gating reflects the *nature* of spending, rather than generic universal purchases.
 let ids=young?['social','fest','supplies','medicine','sport','transport','familycare']:
 s.age<18?['social','fest','supplies','medicine','sport','transport','skills','familycare','trip']:

 if(s.age>68)ids=ids.filter(id=>id!=='skills'||s.knowledge<70);
 if(s.strata<3)ids=ids.filter(id=>!['holiday','vehicle'].includes(id));
 if(s.strata>=6)ids.push('holiday');
 if(!s.school&&s.age<16)ids=ids.filter(id=>id!=='supplies');
 if(!s.income&&adult)ids=ids.filter(id=>id!=='equipment');

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}

O.buy=function(s,id){ensure(s);if(s.status!=='alive')return {ok:false,message:'This life has ended.'};
 const offer=s.spendingOffers.find(o=>o.id===id);if(!offer)return {ok:false,message:'This item is not offered this year.'};

O.passive=function(s){
 oldPassive(s);
 if(s.age<=20){
  ensure(s);

  const householdCost=Math.min(.97,.68+.035*deps+(s.urban?.055:.015)-(s.strata>=5?.10:0));

O.contextForDecision=function(s,e){
 if(!s||!e)return null;

  return {text:`In ${s.country.name}, the reference under-five mortality estimate was ${Number(data.under5).toFixed(1)} deaths per 1,000 live births. That population rate does not determine whether this child is vaccinated or becomes ill.`,source:'UNICEF/UN IGME (under-five mortality)',url:data.under5Source||'https://data.worldbank.org/indicator/SH.DYN.MORT'};

  const f=O.COUNTRY_CONTEXT?.[s.country.code]?.facts?.[0];

O.contextForJournal=function(s,entry){
 if(!entry)return null;

 if(entry.age===0&&/family and local life|a beginning/.test(txt)&&Number.isFinite(profile?.fertility2024))
  return {text:`The fixed 2024 national total fertility rate for ${s.country.name} was approximately ${profile.fertility2024.toFixed(1)} births per woman. This population statistic does not determine this household's family size.`,source:'World Bank SP.DYN.TFRT.IN (2024)',url:`https://data.worldbank.org/indicator/SP.DYN.TFRT.IN?locations=${encodeURIComponent(s.country.code)}`};
 if(profile&&(txt.includes(profile.name.toLowerCase()))&&/prepar|neighbour|festival|celebrat|tradition|gathering|new year|community|family and local life/.test(txt))
   return {text:`${profile.name} is a locally relevant occasion, but traditions and participation vary between families. The household's resources affect what they can afford.`,source:'Cultural background (UNESCO index)',url:'https://ich.unesco.org/en/lists'};
 if((/new sibling|family welcomes|birth in the family/.test(txt))&&Number.isFinite(profile?.fertility2024))

 if(entry.age<=5&&/vaccin|immuni[sz]|infant|childhood (illness|health)/.test(txt)&&Number.isFinite(data?.under5))
   return {text:`Population context: ${Number(data.under5).toFixed(1)} deaths before age five per 1,000 live births in ${s.country.name}; this is not the chance of the fictional event just described.`,source:'UNICEF/UN IGME',url:data.under5Source||'https://data.worldbank.org/indicator/SH.DYN.MORT'};

function artCanvas(scene,s,cls='',id=''){return `<canvas class="${cls}" data-pixel="${safe(scene)}" data-life="${safe(s?.id||'demo')}" ${id?`id="${id}"`:''} role="img" aria-label="Static overhead pixel-art illustration of ${safe(scene)}"></canvas>`}
function renderArt(){root.querySelectorAll('canvas[data-pixel]').forEach(c=>{let life=(state&&c.dataset.life===state.id?state:archive.find(x=>x.id===c.dataset.life))||{seed:14,strata:3,urban:true,gender:'F'};O.drawScene(c,c.dataset.pixel,life)})}
function pill(s){return `<span class="tag ${s.strata<2?'tag-warn':s.strata>=6?'tag-blue':''}">${safe(O.tier(s))}</span>`}
function landing(){return `<main class="landing fade"><div class="landing-grid"><div><p class="eyebrow">Life is not equally distributed</p><h1 class="hero-title">A world of lives.<br><em>One at a time.</em></h1><p class="hero-lede">Be born somewhere in the world, into circumstances you didn't choose. Live through childhood, work, love, wealth, hardship and chance. Every decision becomes part of a life worth remembering.</p><div class="hero-buttons"><button class="btn btn-primary" data-action="new-dialog">Be born into a life →</button>${state?`<button class="btn" data-action="resume">Continue ${safe(state.first)}'s story</button>`:''}<button class="btn" data-action="archive">Explore your lives</button></div><p class="hero-note">Automatic life progression. Decisions pause time. Original static pixel art. Local saves. A growing library of lives. The probabilities and economic figures in this version are illustrative, not a complete demographic dataset.</p></div><div class="hero-art"><div class="art-frame">${artCanvas('city',null)}</div><div class="hero-overlays"><span class="small-pill">◉ Demographic starting conditions</span><span class="small-pill">◇ ${O.COUNTRIES.length} locations</span><span class="small-pill">♡ People who remember you</span></div></div></div><section class="features"><p class="eyebrow">The world in a single life</p><h2 class="section-title">Circumstance. Choice. Consequence.</h2><div class="features-grid"><div class="feature"><div class="symbol">🌍</div><h3>A beginning you don't choose</h3><p>Start in one of ${O.COUNTRIES.length} countries and regions with varying opportunity, household resources and conditions.</p></div><div class="feature"><div class="symbol">↗</div><h3>More than one way through</h3><p>Navigate school, finances, work, relationships and difficult decisions across the whole lifespan.</p></div><div class="feature"><div class="symbol">♥</div><h3>People with histories</h3><p>Meet family, friends, partners, mentors and children whose lives continue alongside yours.</p></div><div class="feature"><div class="symbol">▤</div><h3>Every life remembered</h3><p>Archive entire stories, reopen timelines, compare different starting points and replay a turning point.</p></div></div></section></main>`}
function meter(label,value,cls=''){return `<div><div class="stat-head">${safe(label)} <span>${Math.round(value)}</span></div><div class="meter"><div class="meter-fill ${cls}" style="width:${O.clamp(value)}%"></div></div></div>`}
function stats(s){return `<div class="stats-grid">${meter('Health',s.health)}${meter('Well-being',s.happiness,'amber')}${meter('Learning',s.knowledge,'blue')}${meter('Bonds',s.relationships,'rose')}</div>`}
function dossierSmall(s){return `<div class="identity-block"><img class="avatar" width="55" height="55" src="${O.avatarData({id:s.id,name:s.name})}" alt="Pixel avatar for ${safe(s.name)}"><div><div class="name">${safe(s.name)}</div><div class="caption">${safe(s.country.name)}<br>${safe(O.stage(s.age))} · ${s.gender==='F'?'Female':'Male'} · ${s.urban?'Urban':'Rural'}</div></div></div><hr class="separator"><div class="badges">${pill(s)} ${s.flags.migrated?'<span class="tag tag-blue">Relocated</span>':''}${s.flags.foodInsecure?'<span class="tag tag-warn">Food insecurity</span>':''}</div><hr class="separator"><dl class="fact-list"><dt>Birth year</dt><dd>${s.birthYear}</dd><dt>Schooling</dt><dd>${safe(s.education)}</dd><dt>Occupation</dt><dd>${safe(s.job|| (s.age<18?'Not yet working':'Not employed'))}</dd><dt>Annual earnings*</dt><dd>${O.money(s.income)}</dd><dt>Cash savings*</dt><dd>${O.money(s.cash)}</dd><dt>Debt*</dt><dd>${O.money(s.debt)}</dd><dt>Net worth*</dt><dd>${O.money(O.netWorth(s))}</dd></dl><div class="tiny muted" style="margin-top:13px;line-height:1.6">* Illustrative annual purchasing-power dollars, not local-currency figures.</div>`}
function peoplePanel(s){const ppl=s.people.filter(p=>p.alive).sort((a,b)=>({Parent:0,Mother:0,Father:0,Partner:1,Child:2,Sibling:3,Friend:4,Mentor:5,Grandparent:6}[a.role]||8)-({Parent:0,Mother:0,Father:0,Partner:1,Child:2,Sibling:3,Friend:4,Mentor:5,Grandparent:6}[b.role]||8));return `<div class="panel panel-pad"><p class="panel-label">The people in your life <span class="quiet">${ppl.length} living contacts</span></p>${ppl.length?ppl.slice(0,9).map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><img class="avatar" width="37" height="37" src="${O.avatarData(p)}" alt=""><span class="person-meta"><strong>${safe(O.personLabel(p))}</strong><span>${safe(p.role)} · ${p.age} years · ${safe(p.trait)}</span></span><span class="bond">${p.close}%</span></button>`).join(''):'<p class="empty-note">People will enter your life as it unfolds.</p>'}<button class="disclosure" style="margin-top:12px" data-action="all-people">View all contacts, including people from your past →</button></div>`}
function contextualNote(f){if(!f||!f.text)return '';return `<aside class="story-context"><span class="story-context-label">ⓘ Context, not destiny</span><div>${safe(f.text)}</div>${f.url?`<a href="${safe(f.url)}" target="_blank" rel="noopener noreferrer">${safe(f.source||'Population source')} ↗</a>`:''}<small>Population figures describe groups, not a prediction of this person's life.</small></aside>`}
function journalContext(s,e){return typeof O.contextForJournal==='function'?O.contextForJournal(s,e):null}
function journalPanel(s){const entries=s.journal.slice(0,logCount);return `<div class="panel panel-pad"><p class="panel-label">Life record <span class="quiet">${s.journal.length} memories</span></p><div class="log-list">${entries.map(e=>`<div class="log-entry tone-${e.tone||'neutral'}"><span class="age">Age ${e.age}</span><div class="text"><strong>${safe(e.title)}</strong><div>${safe(e.description)}${contextualNote(journalContext(s,e))}</div></div></div>`).join('')}</div>${logCount<s.journal.length?`<button class="disclosure" data-action="more-log" style="margin-top:14px">See older memories →</button>`:''}</div>`}

function familyIncomeRows(s){const parents=s.people.filter(p=>['Mother','Father'].includes(O.parentRole(p)));return `<div class="panel-label">Family household</div><dl class="fact-list"><dt>Parents' total income*</dt><dd>${O.money(s.familyIncome)}</dd><dt>Family assets*</dt><dd>${O.money(s.familyAssets)}</dd><dt>Family debts*</dt><dd>${O.money(s.familyDebts||0)}</dd><dt>Family net worth*</dt><dd>${O.money(s.familyAssets-(s.familyDebts||0))}</dd><dt>Your own net worth*</dt><dd>${O.money(O.netWorth(s))}</dd><dt>Your income*</dt><dd>${O.money(s.income)}</dd><dt>Housing</dt><dd>${s.flags.livingWithFamily?'With family':s.flags.crowdedHousing?'Crowded housing':s.urban?'Urban household':'Rural household'}</dd></dl><div class="panel-label" style="margin-top:15px">Parents and whereabouts</div>${parents.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><span><strong>${safe(O.personLabel(p))}</strong><br><small>${safe(p.job)} · ${safe(p.residence)} · ${p.alive?'Living':'Died'}</small></span><span class="bond">${safe(O.money(p.annualIncome))} / yr*</span></button>`).join('')}<p class="tiny muted">*Illustrative PPP-dollar estimates; the current economic model is not country-calibrated. Parents' estimated individual earnings are approximate shares of total family income.</p>`}
function factView(s){const extra=O.worldFactHTML?O.worldFactHTML(s,safe):"";const rec=O.COUNTRY_CONTEXT?.[s.country.code];if(!rec)return extra||`<div class="fact-bubble">World Bank data for ${safe(s.country.name)} are not currently available offline.</div>`;return `<div class="panel-label">${safe(rec.topic)}</div>${rec.facts.map(f=>`<div class="fact-bubble"><strong>ⓘ Real-world context</strong>${safe(f.text)}<p class="tiny">${safe(f.source)} · <a target="_blank" rel="noopener" href="${safe(f.url)}">Read the source ↗</a></p><small>This is a population statistic, not the probability of this specific fictional event.</small></div>`).join('')+extra}`}
function spendView(s){
 const options=O.spendOffers(s),funds=O.spendFunds(s),used=s.flags?.spendYearUsed?.[s.age]||[];
 const mode=s.age<18?'Family discretionary funds':'Your personal cash';
 const entries=options.map(o=>{const bought=used.includes(o.id),afford=funds>=o.cost;return `<div class="spend-item"><div class="spend-info"><div class="spend-label">${safe(o.tag)} · ${safe(o.title)}</div><p>${safe(o.detail)}</p><p class="tiny muted">Modelled cost: <strong>${O.money(o.cost)}</strong> (international purchasing-power units)</p></div><button class="btn btn-small ${afford&&!bought?'btn-primary':''}" data-action="buy" data-id="${safe(o.id)}" ${bought||!afford?'disabled':''}>${bought?'Paid':afford?'Spend':'Too costly'}</button></div>`}).join('');
 const history=(s.spendHistory||[]).slice(0,5).map(o=>`<div class="small" style="padding:6px 0">Age ${o.age}: ${safe(o.title)} · ${O.money(o.cost)}</div>`).join('');
 return `<div class="spend-head"><p class="panel-label">Spend & plan · Age ${s.age}</p><h3>${O.money(funds)}</h3><p class="tiny">${safe(mode)} available. Offers stay fixed through this year, then refresh when you turn ${s.age+1}. The costs are fictional PPP-dollar estimates, not local prices.</p></div><div class="spend-list">${entries}</div><p class="panel-label" style="margin-top:20px">Recent spending</p>${history||'<p class="tiny muted">No purchases yet.</p>'}`;
}
function inspectorView(s){if(!inspector)return '';const tabs=[['profile','My profile'],['family','Family & money'],['people','People'],['spend','Spend & plan']];let content=inspector==='profile'?`<dl class="fact-list"><dt>Age</dt><dd>${s.age}</dd><dt>Birthplace</dt><dd>${safe(s.country.name)} · ${s.urban?'Urban':'Rural'}</dd><dt>Education</dt><dd>${safe(s.education)}</dd><dt>Occupation</dt><dd>${safe(s.job||'Not employed')}</dd><dt>Current focus</dt><dd>${safe(s.focus)}</dd><dt>Interests</dt><dd>${safe((s.interests||[]).join(', ')||'Not established')}</dd><dt>Health</dt><dd>${s.health}/100</dd><dt>Happiness</dt><dd>${s.happiness}/100</dd><dt>Knowledge</dt><dd>${s.knowledge}/100</dd><dt>Relationships</dt><dd>${s.relationships}/100</dd></dl>`:inspector==='family'?familyIncomeRows(s):inspector==='spend'?spendView(s):s.people.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><span><strong>${safe(O.personLabel(p))}</strong><br><small>${safe(p.job)} · ${safe(p.residence||'Location unknown')} · ${p.alive?'Alive':'Deceased'}</small></span><span class="bond">${p.close}%</span></button>`).join('');return `<div class="inspector-shade" id="inspector-shade"><section class="inspector-sheet" role="dialog" aria-modal="true" aria-label="Character details"><div style="display:flex;align-items:center;justify-content:space-between"><strong>${safe(s.name)} · Age ${s.age}</strong><button class="btn btn-small" data-action="close-inspector">Done ✕</button></div><div class="inspector-tabs">${tabs.map(([key,label])=>`<button class="${inspector===key?'active':''}" data-action="inspector" data-tab="${key}">${label}</button>`).join('')}</div>${content}<p class="tiny muted" style="margin-top:20px">${s.pending?'Your unanswered decision remains paused. Close this panel to return to it.':''}</p></section></div>`}


function yearlyFocusOptions(s){
 if(s.age<6)return [['Balanced','Play and explore'],['Health','Rest and wellbeing'],['Relationships','Family bonds'],['Learning','Early learning']];
 if(s.age<18)return [['Balanced','Balanced year'],['Learning','Study harder'],['Health','Health and sport'],['Relationships','Friends and family'],['Rest','Hobbies and rest']];
 if(s.age<65)return [['Balanced','Balanced year'],['Career','Career and work'],['Learning','Further learning'],['Health','Health and fitness'],['Relationships','Relationships'],['Rest','Rest and hobbies']];
 return [['Balanced','Balanced year'],['Health','Wellbeing'],['Relationships','Family and friends'],['Learning','Keep learning'],['Rest','Rest and reflection']];
}
function game(){
 const s=state;if(!s)return landing();
 const ev=s.pending?O.EVENTS.find(x=>x.id===s.pending):null;
 const last=s.journal[0];
 const status=s.status==='finished'?'The story of this life has ended.':s.age===0&&s.month<2?'A new life begins. The years will unfold automatically.':last?.description||'Life goes on.';
 const displayTitle=s.status==='finished'?'A life remembered':last?.title||'A beginning';
 const choices=ev?ev.options(s):[];
 const control=`<div class="life-controls" role="group" aria-label="Life playback controls">

else if(modal.type==='people'){const s=modal.life;heading='The people you encountered';body=`${s.people.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><img class="avatar" src="${O.avatarData(p)}" width="42" height="42" alt=""><span class="person-meta"><strong>${safe(O.personLabel(p))}</strong><span>${safe(p.role)} · Age ${p.age} · ${p.alive?'Living':'Died'}</span></span><span class="bond">${p.close}%</span></button>`).join('')}<div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>`}

function drawBirthRoulette(){

 },100);

function stopClock(){playing=false;if(clockTimer){clearInterval(clockTimer);clockTimer=null;}monthBank=0;}

function syncTime(){const bar=$('#month-fill');if(bar)bar.style.width=(state.month/12*100)+'%';const visible=$('.time-label');if(visible)visible.textContent=`Age ${state.age} · ${state.month+1}/12`;const label=$('#live-age');if(label)label.textContent=`· Age ${state.age} · Month ${state.month+1}`}
function tickClock(){if(!state||state.status!=='alive'||view!=='game'){stopClock();return}if(state.pending){resumeAfterDecision=true;stopClock();render();return}
 const now=performance.now(),dt=Math.max(0,Math.min(700,now-lastPulse));lastPulse=now;monthBank+=dt*clockSpeed/3750;

 while(monthBank>=1&&n++<8&&state.status==='alive'&&!state.pending){monthBank-=1;const r=O.advanceMonth(state);if(r.entry||r.birthday||r.finished)draw=true;if(r.decision){if(autoChoices){const e=O.EVENTS.find(x=>x.id===state.pending);if(e){O.applyChoice(state,O.int(state,0,e.options(state).length-1));draw=true}}else{resumeAfterDecision=true;stopClock();draw=true;break}}}
 if(n>0){saveCurrent();if(state.status==='finished'){stopClock();persistFinished();draw=true}if(draw)render();else syncTime()}
}

async function handle(action,el){switch(action){
 case 'home':stopClock();resumeAfterInspector=false;view='landing';break;

 case 'start':{decisionAside=false;inspector=null;resumeAfterInspector=false;const country=$('#new-country')?.value||'random',classChoice=$('#new-class')?.value||'random';stopClock();if(state?.status==='alive'){await putArchive({...state,status:'paused'});await refreshArchive()}state=O.create({country,classChoice,draw:'birth',year:2026});saveCurrent();view='game';modal=null;logCount=10;chapter='timeline';birthReveal=true;birthRouletteFinished=false;birthRevealStarted=performance.now();stopClock();break}
 case 'choose':{if(!state||!state.pending)return;decisionAside=false;inspector=null;state.lastEventTitle=O.EVENTS.find(x=>x.id===state.pending)?.title(state);O.applyChoice(state,Number(el.dataset.index));saveCurrent();if(resumeAfterDecision){resumeAfterDecision=false;startClock()}break}

  case 'inspector':if(playing){resumeAfterInspector=true;stopClock()}decisionAside=!!state?.pending;inspector=el.dataset.tab||'profile';break;
  case 'close-inspector':inspector=null;if(resumeAfterInspector&&!state?.pending&&state?.status==='alive'){resumeAfterInspector=false;startClock()}break;
  case 'next-decision':{if(!state||state.pending||state.status!=='alive')return;stopClock();resumeAfterDecision=true;O.skipToDecision(state);saveCurrent();if(state.status==='finished')await persistFinished();break}
 
 case 'dismiss-birth':birthReveal=false;birthRouletteFinished=true;if(birthRouletteTimer)clearInterval(birthRouletteTimer);birthRouletteTimer=null;startClock();break;
 case 'play-pause':if(playing)stopClock();else startClock();break;
 case 'speed':clockSpeed=Number(el.dataset.value)||4;break;
 case 'more-log':logCount+=15;break;
 case 'person':{if(playing){resumeAfterInspector=true;stopClock()}const life=selectedLife();const person=life?.people.find(p=>p.id===el.dataset.id);if(person)modal={type:'person',person};break}
 case 'all-people':modal={type:'people',life:state};break;
 case 'record':view='detail';detailId=el.dataset.id;chapter='timeline';break;
 case 'resume-record':{const saved=archive.find(x=>x.id===el.dataset.id);if(!saved||saved.status!=='paused')break;if(state?.status==='alive'&&state.id!==saved.id)await putArchive({...state,status:'paused'});state=JSON.parse(JSON.stringify(saved));O.ensureTimeline(state);state.status='alive';await deleteArchive(saved.id);await refreshArchive();saveCurrent();view='game';chapter='timeline';if(!state.pending)startClock();break}
 case 'detail-current':view='detail';detailId='current';chapter='timeline';await persistFinished();break;
 case 'chapter':chapter=el.dataset.chapter;break;
 case 'compare':if(compare.size===2)view='compare';break;
 case 'export':backupDownload({format:'other-lives-backup-v1',date:new Date().toISOString(),current:state,lives:archive},`other-lives-backup-${new Date().toISOString().slice(0,10)}.json`);notify('Backup downloaded. Keep it somewhere safe.');break;
 case 'export-one':{const life=archive.find(s=>s.id===el.dataset.id)||state;if(life)backupDownload({format:'other-lives-life-v1',life},`other-lives-${life.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`);break}
 case 'import':$('#import-file').click();break;
 case 'delete-prompt':modal={type:'delete',id:el.dataset.id};break;
 case 'delete':{await deleteArchive(el.dataset.id);compare.delete(el.dataset.id);await refreshArchive();modal=null;view='archive';notify('Record deleted from this browser.');break}
 case 'fork':{if(state?.status==='alive'){await putArchive({...state,status:'paused'});await refreshArchive()}const from=archive.find(x=>x.id===el.dataset.id)||state;const snap=from?.snapshots.find(x=>x.age===Number(el.dataset.age));if(!snap)return;const ns=JSON.parse(JSON.stringify(snap.data));ns.id='life-'+Date.now()+'-'+Math.floor(Math.random()*100000);ns.snapshots=[];ns.startedAt=new Date().toISOString();ns.finishedAt=null;ns.status='alive';ns.cause=null;ns.lastOutcome='';O.journal(ns,'Another possible path','You have restarted from an earlier turning point. The original life is preserved in the archive.','life');O.ensureTimeline(ns);state=ns;saveCurrent();view='game';chapter='timeline';if(!state.pending)startClock();notify('Alternate life created. Your original remains safe.');break}
 }render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopClock();saveCurrent();render();}});
root.addEventListener('click',async ev=>{let btn=ev.target.closest('[data-action]');if(btn){ev.preventDefault();try{await handle(btn.dataset.action,btn)}catch(e){console.error(e);notify('An unexpected error occurred. You can export a backup from the archive.')}return}if(ev.target.id==='inspector-shade'){inspector=null;if(resumeAfterInspector&&!state?.pending&&state?.status==='alive'){resumeAfterInspector=false;startClock()}render();return}if(ev.target.id==='modal-backdrop'){modal=null;render()}});
root.addEventListener('change',e=>{if(e.target.dataset.change==='autodecide'){autoChoices=e.target.checked;if(autoChoices&&state?.pending){const ev=O.EVENTS.find(x=>x.id===state.pending);if(ev){O.applyChoice(state,O.int(state,0,ev.options(state).length-1));saveCurrent();startClock();render();}}return;}if(e.target.dataset.change==='focus'&&state){state.focus=e.target.value;saveCurrent()}else if(e.target.dataset.compare){if(e.target.checked){if(compare.size===2){e.target.checked=false;notify('Select only two lives at a time.');return}compare.add(e.target.dataset.compare)}else compare.delete(e.target.dataset.compare);render()}});
const fileInput=document.createElement('input');fileInput.type='file';fileInput.id='import-file';fileInput.accept='.json,application/json';fileInput.hidden=true;document.body.appendChild(fileInput);
fileInput.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const lives=data.format==='other-lives-life-v1'?[data.life]:data.format==='other-lives-backup-v1'?data.lives:[];if(!lives||!Array.isArray(lives))throw Error('Invalid format');let n=0;for(const s of lives){if(s&&s.id&&s.country&&Array.isArray(s.journal)&&['finished','paused'].includes(s.status)){await putArchive(s);n++}}if(data.current&&data.current.id&&data.current.country&&(!state||confirm('Replace the current in-progress life with the one in this backup?'))){state=data.current;saveCurrent()}await refreshArchive();view='archive';render();notify(`Imported ${n} archived ${plural(n,'life','lives')}.`)}catch(err){notify('Could not read this backup. Check that it is an Other Lives JSON file.')}fileInput.value=''});

loadCurrent();refreshArchive().then(()=>{render()});
})(window.OL);

</script>

<script>
/* V2.5: persistent, context-sensitive character life events. All fictional narratives,
   not assertions that demographic identity causes a personal outcome. */
(function(O){
 const OLD=O.pickStories;
 O.pickStories=function(s,n){
  const out=OLD(s,n); const id=s.country.code; const age=s.age;
  if(n&&age>=3&&age<=90){
   if(!s.flags.personalThread)s.flags.personalThread=O.pick(s,['books','sport','music','drawing','animals','technology']);
   const thread=s.flags.personalThread, people=(s.people||[]).filter(p=>p.alive);
   const mother=people.find(p=>p.role==='Mother');const father=people.find(p=>p.role==='Father');
   const guardian=mother||father||people[0];
   const who=guardian?O.personLabel(guardian):'a family member';
   let custom=null;
   if(age>=5&&age<16&&s.school&&O.chance(s,.30)){
    const subject=thread==='sport'?'physical education':thread==='music'?'music':thread==='technology'?'computing':thread==='drawing'?'art':'history';
    const teacherNames={GH:['Ms. Mensah','Mr. Boateng'],HK:['Ms. Chan','Mr. Wong'],BD:['Mr. Rahman','Ms. Akter'],GB:['Ms. Smith','Mr. Taylor'],IN:['Ms. Das','Mr. Sharma'],NG:['Mr. Okafor','Ms. Adebayo'],ET:['Ms. Bekele','Mr. Tesfaye']};const teacher=s.flags.favouriteTeacher||O.pick(s,teacherNames[id]||['Ms. Taylor','Mr. Lee']);
    s.flags.favouriteTeacher=teacher;
    custom={title:`${teacher} notices your interest`,description:`Your ${subject} teacher, ${teacher}, notices how much attention you pay. A short conversation leaves you feeling seen. ${who} asks what made you so cheerful when you return home.`,scene:'school',effect:'thread-encouragement'};
    s.flags.teacherMemory=age;
   } else if(s.flags.teacherMemory&&age-s.flags.teacherMemory>=4&&!s.flags.teacherReflection&&O.chance(s,.26)){
    custom={title:'A voice you remember',description:`You remember how ${s.flags.favouriteTeacher||'a teacher'} once encouraged your interest in ${thread}. That small moment comes back as you think about the next stage of life.`,scene:'home',effect:'thread-reflection'};
    s.flags.teacherReflection=true;
   } else if(age>=10&&O.chance(s,.19)){
    const examples={GH:[`A tro-tro fare increase changes how your household plans travel. ${who} explains what must wait until the next pay day.`,`At a neighbourhood gathering, talk turns to school costs and work. You notice adults have different ideas about opportunity.`],HK:[`Your household compares public transport routes and rising housing costs. ${who} discusses how little space can shape daily routines.`,`A classmate talks about tutorials and school places. You compare experiences without assuming every family can afford the same support.`],BD:[`Seasonal rain changes the trip to school or market. ${who} worries about lost work time.`,`At a local bazaar, you hear adults comparing prices, debt and ways to manage household expenses.`],GB:[`A teacher describes different routes through GCSEs, sixth form, apprenticeships and college. ${who} asks what appeals to you.`,`A family conversation turns to housing costs and the possibility of moving farther from work.`],NG:[`A neighbour discusses fuel and transport expenses. ${who} adjusts the household budget.`,`A schoolfriend tells you about different exam and vocational routes, opening a new line of thought.`],IN:[`Your household plans around education fees, travel distance and exam options. ${who} shares their hopes.`,`You overhear a conversation about moving cities for work and the relatives who have already left.`],ET:[`Rainfall affects daily plans for some neighbours. ${who} talks about what that means for supplies.`,`You hear adults discuss community savings and how local networks can help during a difficult season.`]};
    const pool=examples[id];if(pool)custom={title:({GH:'Fares and family budgets',HK:'Daily life in Hong Kong',BD:'Seasonal routines and prices',GB:'Choices closer to home',NG:'Life in the neighbourhood',IN:'Costs and opportunities',ET:'Community and seasons'})[id],description:O.pick(s,pool),scene:'city',effect:'local-'+id};
   }
   if(custom)out[O.int(s,0,out.length-1)]=custom;
  }
  return out;
 };
 const prevFire=O.fireStory;
 O.fireStory=function(s,item){prevFire(s,item);if(item.effect==='thread-encouragement')O.adjust(s,{knowledge:2,happiness:2});};
})(window.OL);
</script>
