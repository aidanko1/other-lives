/* PWA safe-area support for modern iPhones, without changing text-based gameplay. */
@supports (padding: max(0px)) {

 all.sort(()=>O.rand(s)-.5);

 // First process anything at the current position not yet processed.
 const due=s.agenda.find(a=>a.month<=s.month&&!a.done);
 if(due){
  due.done=true;
  if(due.type==='story')O.fireStory(s,due);
  else{

 }
 if(s.month<11){s.month++;s.lastOutcome='';return {advanced:true};}
 s.age++;s.month=0;s.lastOutcome='';
 O.passive(s);
 if(O.mortality(s)){O.finish(s);return {advanced:true,finished:true,birthday:true};}
 O.snapshot(s);
 s.agenda=O.makeAgenda(s);

};
O.advance=function(s){ // Legacy compatibility; advance to the next birthday or decision.

 if(!s||s.status!=='alive'||s.pending)return 0;

async function deleteArchive(id){const db=await dbPromise;if(!db){const a=archive.filter(x=>x.id!==id);localStorage.setItem(FALLBACK,JSON.stringify(a));return}return new Promise(resolve=>{const tx=db.transaction('lives','readwrite');tx.objectStore('lives').delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()})}
async function refreshArchive(){archive=(await fetchArchive()).sort((a,b)=>String(b.finishedAt||b.startedAt).localeCompare(String(a.finishedAt||a.startedAt)));}
function notify(message){let t=$('.toast');if(t)t.remove();const n=document.createElement('div');n.className='toast';n.textContent=message;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3000)}
function base(children){return `<div class="app-shell"><header class="topbar"><button class="brand" data-action="home"><img class="brand-pixel" src="${(O.spriteAvatar||O.avatarData)({id:"other-lives-brand",name:"Other Lives",age:30})}" width="42" height="42" alt=""><span><span class="brand-name" style="display:block">Other Lives</span><span class="brand-sub" style="display:block">An atlas of possible lives</span></span></button><nav class="top-actions"><button class="btn btn-text" data-action="info">About the model</button><button class="btn" data-action="archive">Life archive <span class="muted">${archive.length}</span></button>${state?`<button class="btn" data-action="resume">${state.status==='finished'?'Last life':'Continue life'}</button>`:''}<button class="btn btn-primary" data-action="new-dialog">+ New life</button></nav></header>${children}<footer class="footer-note">OTHER LIVES · An independent fictional simulation, not an official version of any existing game. Illustrative modelling parameters, not personal predictions or country-level forecasts. Local data stays in this browser unless you export it.</footer></div>${modalView()}`}
function artCanvas(scene,s,cls='',id=''){return `<canvas class="${cls}" data-pixel="${safe(scene)}" data-life="${safe(s?.id||'demo')}" ${id?`id="${id}"`:''} role="img" aria-label="Static overhead pixel-art illustration of ${safe(scene)}"></canvas>`}
function renderArt(){root.querySelectorAll('canvas[data-pixel]').forEach(c=>{let life=(state&&c.dataset.life===state.id?state:archive.find(x=>x.id===c.dataset.life))||{seed:14,strata:3,urban:true,gender:'F'};O.drawScene(c,c.dataset.pixel,life)})}
function pill(s){return `<span class="tag ${s.strata<2?'tag-warn':s.strata>=6?'tag-blue':''}">${safe(O.tier(s))}</span>`}
function landing(){return `<main class="landing fade"><div class="landing-grid"><div><p class="eyebrow">Life is not equally distributed</p><h1 class="hero-title">A world of lives.<br><em>One at a time.</em></h1><p class="hero-lede">Be born somewhere in the world, into circumstances you didn't choose. Live through childhood, work, love, wealth, hardship and chance. Every decision becomes part of a life worth remembering.</p><div class="hero-buttons"><button class="btn btn-primary" data-action="new-dialog">Be born into a life →</button>${state?`<button class="btn" data-action="resume">Continue ${safe(state.first)}'s story</button>`:''}<button class="btn" data-action="archive">Explore your lives</button></div><p class="hero-note">Automatic life progression. Decisions pause time. Original static pixel art. Local saves. A growing library of lives. The probabilities and economic figures in this version are illustrative, not a complete demographic dataset.</p></div><div class="hero-art"><div class="art-frame">${artCanvas('city',null)}</div><div class="hero-overlays"><span class="small-pill">◉ Demographic starting conditions</span><span class="small-pill">◇ ${O.COUNTRIES.length} locations</span><span class="small-pill">♡ People who remember you</span></div></div></div><section class="features"><p class="eyebrow">The world in a single life</p><h2 class="section-title">Circumstance. Choice. Consequence.</h2><div class="features-grid"><div class="feature"><div class="symbol">🌍</div><h3>A beginning you don't choose</h3><p>Start in one of ${O.COUNTRIES.length} countries and regions with varying opportunity, household resources and conditions.</p></div><div class="feature"><div class="symbol">↗</div><h3>More than one way through</h3><p>Navigate school, finances, work, relationships and difficult decisions across the whole lifespan.</p></div><div class="feature"><div class="symbol">♥</div><h3>People with histories</h3><p>Meet family, friends, partners, mentors and children whose lives continue alongside yours.</p></div><div class="feature"><div class="symbol">▤</div><h3>Every life remembered</h3><p>Archive entire stories, reopen timelines, compare different starting points and replay a turning point.</p></div></div></section></main>`}
function meter(label,value,cls=''){return `<div><div class="stat-head">${safe(label)} <span>${Math.round(value)}</span></div><div class="meter"><div class="meter-fill ${cls}" style="width:${O.clamp(value)}%"></div></div></div>`}
function stats(s){return `<div class="stats-grid">${meter('Health',s.health)}${meter('Well-being',s.happiness,'amber')}${meter('Learning',s.knowledge,'blue')}${meter('Bonds',s.relationships,'rose')}</div>`}
function dossierSmall(s){return `<div class="identity-block"><img class="avatar" width="55" height="55" src="${O.spriteAvatar?O.spriteAvatar(s):O.avatarData({id:s.id,name:s.name})}" alt="Pixel avatar for ${safe(s.name)}"><div><div class="name">${safe(s.name)}</div><div class="caption">${safe(s.country.name)}<br>${safe(O.stage(s.age))} · ${s.gender==='F'?'Female':'Male'} · ${s.urban?'Urban':'Rural'}</div></div></div><hr class="separator"><div class="badges">${pill(s)} ${s.flags.migrated?'<span class="tag tag-blue">Relocated</span>':''}${s.flags.foodInsecure?'<span class="tag tag-warn">Food insecurity</span>':''}</div><hr class="separator"><dl class="fact-list"><dt>Birth year</dt><dd>${s.birthYear}</dd><dt>Schooling</dt><dd>${safe(s.education)}</dd><dt>Occupation</dt><dd>${safe(s.job|| (s.age<18?'Not yet working':'Not employed'))}</dd><dt>Annual earnings*</dt><dd>${O.money(s.income)}</dd><dt>Cash savings*</dt><dd>${O.money(s.cash)}</dd><dt>Debt*</dt><dd>${O.money(s.debt)}</dd><dt>Net worth*</dt><dd>${O.money(O.netWorth(s))}</dd></dl><div class="tiny muted" style="margin-top:13px;line-height:1.6">* Game purchasing-power equivalents in your selected display currency.</div>`}
function peoplePanel(s){const ppl=s.people.filter(p=>p.alive).sort((a,b)=>({Parent:0,Mother:0,Father:0,Partner:1,Child:2,Sibling:3,Friend:4,Mentor:5,Grandparent:6}[a.role]||8)-({Parent:0,Mother:0,Father:0,Partner:1,Child:2,Sibling:3,Friend:4,Mentor:5,Grandparent:6}[b.role]||8));return `<div class="panel panel-pad"><p class="panel-label">The people in your life <span class="quiet">${ppl.length} living contacts</span></p>${ppl.length?ppl.slice(0,9).map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><img class="avatar" width="37" height="37" src="${O.avatarData(p)}" alt=""><span class="person-meta"><strong>${safe(O.profileLabel(p))}</strong><span>${safe(p.role)} · ${p.age} years · ${safe(p.trait)}</span></span><span class="bond">${p.close}%</span></button>`).join(''):'<p class="empty-note">People will enter your life as it unfolds.</p>'}<button class="disclosure" style="margin-top:12px" data-action="all-people">View all contacts, including people from your past →</button></div>`}
function contextualNote(f){if(!f||!f.text)return '';return `<aside class="story-context"><span class="story-context-label">ⓘ Context, not destiny</span><div>${safe(f.text)}</div>${f.url?`<a href="${safe(f.url)}" target="_blank" rel="noopener noreferrer">${safe(f.source||'Population source')} ↗</a>`:''}<small>Population figures describe groups, not a prediction of this person's life.</small></aside>`}
function journalContext(s,e){return typeof O.contextForJournal==='function'?O.contextForJournal(s,e):null}
function journalPanel(s){const entries=s.journal.slice(0,logCount);return `<div class="panel panel-pad"><p class="panel-label">Life record <span class="quiet">${s.journal.length} memories</span></p><div class="log-list">${entries.map(e=>`<div class="log-entry tone-${e.tone||'neutral'}"><span class="age">Age ${e.age}</span><div class="text"><strong>${safe(O.cleanLogText?O.cleanLogText(s,e.title):e.title)}</strong><div>${safe(O.cleanLogText?O.cleanLogText(s,e.description):e.description)}${O.moneyDeltaHTML?.(e)||''}${contextualNote(journalContext(s,e))}</div></div></div>`).join('')}</div>${logCount<s.journal.length?`<button class="disclosure" data-action="more-log" style="margin-top:14px">See older memories →</button>`:''}</div>`}

function familyIncomeRows(s){O.ensureClarity?.(s);const parents=s.people.filter(p=>['Mother','Father'].includes(O.parentRole(p)));return `<div class="panel-label">Family household</div><dl class="fact-list"><dt>Parents' total income*</dt><dd>${O.money(s.familyIncome)}</dd><dt>Family assets*</dt><dd>${O.money(s.familyAssets)}</dd><dt>Family debts*</dt><dd>${O.money(s.familyDebts||0)}</dd><dt>Family net worth*</dt><dd>${O.money(s.familyAssets-(s.familyDebts||0))}</dd><dt>Your own net worth*</dt><dd>${O.money(O.netWorth(s))}</dd><dt>Your income*</dt><dd>${O.money(s.income)}</dd><dt>Housing</dt><dd>${s.flags.livingWithFamily?'With family':s.flags.crowdedHousing?'Crowded housing':s.urban?'Urban household':'Rural household'}</dd></dl><div class="panel-label" style="margin-top:15px">Parents and whereabouts</div>${parents.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><span><strong>${safe(O.profileLabel(p))}</strong><br><small>Age ${p.age} · ${safe(p.job)} · ${safe(p.residence)} · ${p.alive?'Living':'Died at '+(p.diedAt??p.age)}</small></span><span class="bond">${safe(O.money(p.annualIncome))} / yr*</span></button>`).join('')}<p class="tiny muted">*Illustrative purchasing-power equivalents; the current economic model is not country-calibrated. Parents' estimated individual earnings are approximate shares of total family income.</p>`}
function factView(s){const extra=O.worldFactHTML?O.worldFactHTML(s,safe):"";const rec=O.COUNTRY_CONTEXT?.[s.country.code];if(!rec)return extra||`<div class="fact-bubble">World Bank data for ${safe(s.country.name)} are not currently available offline.</div>`;return `<div class="panel-label">${safe(rec.topic)}</div>${rec.facts.map(f=>`<div class="fact-bubble"><strong>ⓘ Real-world context</strong>${safe(f.text)}<p class="tiny">${safe(f.source)} · <a target="_blank" rel="noopener" href="${safe(f.url)}">Read the source ↗</a></p><small>This is a population statistic, not the probability of this specific fictional event.</small></div>`).join('')+extra}`}
function spendView(s){return O.spendHTML?O.spendHTML(s):'<p>Loading your budget…</p>'; }

function gameTabContent(s){
 const tabs=[['log','Life log'],['profile','Profile'],['family','Family'],['people','People'],['spend',s.age<12?'Activities':s.age<18?'Pocket money':'Spend']];
 const buttons=`<nav class="story-tabs" aria-label="Life details">${tabs.map(([id,label])=>`<button data-action="game-tab" data-tab="${id}" class="${gameTab===id?'active':''}" aria-current="${gameTab===id?'page':'false'}">${label}</button>`).join('')}</nav>`;
 let content='';
 if(gameTab==='log') content=journalPanel(s);
 else if(gameTab==='profile') content=O.profileHTML?.(s)||'';
 else if(gameTab==='family') content=`<div class="panel panel-pad">${O.familyHTML?.(s)||''}${familyIncomeRows(s)}</div>`;
 else if(gameTab==='people') content=peoplePanel(s);
 else content=`<div class="panel panel-pad">${spendView(s)}</div>`;
 return `<section class="life-details" id="life-details">${buttons}${gameTab!=='log'?'<p class="tab-pause-note">Time is paused. Press Play to return to Life log and continue.</p>':''}${content}</section>`;
}
function inspectorView(s){if(!inspector)return '';const tabs=[['profile','My profile'],['family','Family & money'],['people','People'],['spend',s.age<12?'Activities':s.age<18?'Pocket money':'Spend & plan']];let content=inspector==='profile'?(O.profileHTML?.(s)||''):inspector==='family'?familyIncomeRows(s):inspector==='spend'?spendView(s):s.people.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><span><strong>${safe(O.profileLabel(p))}</strong><br><small>${safe(p.job)} · ${safe(p.residence||'Location unknown')} · ${p.alive?'Alive':'Deceased'}</small></span><span class="bond">${p.close}%</span></button>`).join('');return `<div class="inspector-shade" id="inspector-shade"><section class="inspector-sheet" role="dialog" aria-modal="true" aria-label="Character details"><div style="display:flex;align-items:center;justify-content:space-between"><strong>${safe(s.name)} · Age ${s.age}</strong><button class="btn btn-small" data-action="close-inspector">Done ✕</button></div><div class="inspector-tabs">${tabs.map(([key,label])=>`<button class="${inspector===key?'active':''}" data-action="inspector" data-tab="${key}">${label}</button>`).join('')}</div>${content}<p class="tiny muted" style="margin-top:20px">${s.pending?'Your unanswered decision remains paused. Close this panel to return to it.':''}</p></section></div>`}


function yearlyFocusOptions(s){
 if(s.age<6)return [['Balanced','Play and explore'],['Health','Rest and wellbeing'],['Relationships','Family bonds'],['Learning','Early learning']];
 if(s.age<18)return [['Balanced','Balanced year'],['Learning','Study harder'],['Health','Health and sport'],['Relationships','Friends and family'],['Rest','Hobbies and rest']];
 if(s.age<65)return [['Balanced','Balanced year'],['Career','Career and work'],['Learning','Further learning'],['Health','Health and fitness'],['Relationships','Relationships'],['Rest','Rest and hobbies']];
 return [['Balanced','Balanced year'],['Health','Wellbeing'],['Relationships','Family and friends'],['Learning','Keep learning'],['Rest','Rest and reflection']];
}
function birthRevealView(s){
 const revealed=birthRouletteFinished;
 return `<main class="game-main"><div class="birth-shade"><section class="birth-reveal" role="dialog" aria-modal="true" aria-label="New life reveal"><p class="eyebrow">A life begins somewhere</p><div class="draw-globe" aria-hidden="true">◌</div><p class="birth-rolling">${revealed?'A beginning, drawn at random':'Searching across the world…'}</p><h2>${revealed?safe(s.name):'Drawing your birthplace…'}</h2>${revealed?`<p>You were born in <strong>${safe(s.country.name)}</strong> in ${s.birthYear}.</p><p>${safe(s.urban?'Urban':'Rural')} community · ${safe(O.tier(s))}</p><button class="btn btn-primary" data-action="dismiss-birth">Begin this life →</button>`:'<p role="status">Your new life is being drawn.</p>'}</section></div></main>`;
}
function game(){
 const s=state;if(!s)return landing();O.ensureClarity?.(s);
 if(birthReveal)return birthRevealView(s);
 const ev=s.pending?O.EVENTS.find(x=>x.id===s.pending):null;
 const last=s.journal[0];
 const status=s.status==='finished'?'The story of this life has ended.':s.age===0&&s.month<2?'A new life begins. The years will unfold automatically.':O.cleanLogText(s,last?.description||'Life goes on.');
 const displayTitle=s.status==='finished'?'A life remembered':last?.title||'A beginning';
 const choices=ev?(O.decisionOptions?O.decisionOptions(s,ev):ev.options(s)):[];
 const control=`<div class="life-controls" role="group" aria-label="Life playback controls">
 <button class="btn btn-primary" data-action="play-pause" ${s.status!=='alive'?'disabled':''}>${playing?'❚❚ Pause':'▶ Play'}</button>
 <div class="speed-list">${[1,2,4,8,12,16].map(v=>`<button class="speed-btn ${clockSpeed===v?'selected':''}" data-action="speed" data-value="${v}" aria-pressed="${clockSpeed===v}">${v}×</button>`).join('')}</div><div class="time-with-speed"><span class="time-label">Age ${s.age} · Month ${s.month+1}/12</span><div class="time-track"><div class="time-fill" id="month-fill" style="width:${s.month/12*100}%"></div></div></div>
  <button class="btn btn-small" data-action="next-decision" ${s.status!=='alive'||s.pending?'disabled':''}>Next »</button>
 <label class="auto-choice-toggle"><input type="checkbox" data-change="autodecide" ${autoChoices?'checked':''}> Auto decisions</label>
 </div>`;
 return `<main class="game-main"><div class="page-heading"><div><p class="eyebrow">${s.birthYear+s.age} · ${safe(O.stage(s.age))}</p><h1>${safe(s.first)}'s life <span class="muted" id="live-age">· Age ${s.age}${s.status==='alive'?' · Month '+(s.month+1):''}</span></h1><div class="badges"><span class="tag">${safe(s.country.name)}</span>${pill(s)}${s.status==='finished'?'<span class="tag tag-warn">Life complete</span>':''}</div></div><div class="controls"><button class="btn btn-small" data-action="archive">Archive</button></div></div>
 ${s.status==='alive'?`<div class="time-sticky"><div class="combined-controls"><div class="focus-control"><label for="focus">Life focus</label><select id="focus" data-change="focus">${yearlyFocusOptions(s).map(([key,label])=>`<option value="${key}" ${s.focus===key?'selected':''}>${label}</option>`).join('')}</select></div>${control}</div></div>`:''}
  ${s.pending&&decisionAside?`<div class="decision-resume"><span>⏸ A decision is waiting. Time is stopped.</span><button class="btn btn-small" data-action="return-decision">Open decision ↗</button></div>`:''}
 <div class="game-layout"><section class="left-stack"><div class="panel"><div class="game-scene">${artCanvas('household',s)}<div class="household-caption"><strong>${safe(O.householdCaption?.(s)||s.country.name)}</strong><small>${safe(O.householdAges?.(s)||'')}</small></div></div>${stats(s)}${O.financesHTML?.(s)||''}<div class="event-content"><div class="event-header"><span class="event-category">${s.status==='finished'?'The end of a life':playing?'Life unfolding':s.pending?'Decision waiting':'Time paused'}</span><span class="tag">Age ${s.age} · ${s.month+1}/12</span></div><h2 class="event-title">${safe(O.cleanLogText(s,displayTitle))}</h2><p class="event-copy tone-${last?.tone||'neutral'}">${safe(status)}</p>${contextualNote(journalContext(s,last))}${s.lastOutcome?`<div class="outcome"><strong>What happened</strong>${safe(O.cleanLogText(s,s.lastOutcome))}</div>`:''}${s.status==='finished'?`<section class="death-summary" role="status"><span class="eyebrow">Life ended · ${safe(s.birthYear+s.age)}</span><h3>${safe(s.first)} died at age ${s.age}</h3><p><strong>Recorded cause:</strong> ${safe(s.cause||'Cause not recorded')}</p><p>${safe(s.deathContext||'This is a fictional simulated outcome.')}</p>${O.countryEvidence(s).under5!==null?`<p class="small muted">Reference: UNICEF 2024 under-five mortality in ${safe(s.country.name)}: ${O.countryEvidence(s).under5} per 1,000 live births. This is a population statistic, not a personal prediction. <a target="_blank" rel="noopener" href="${O.countryEvidence(s).under5Source}">Source ↗</a></p>`:""}<button class="btn btn-primary" data-action="detail-current">Review the complete life →</button></section>`:''}<div class="year-actions">${s.status==='finished'?`<button class="btn btn-primary" data-action="detail-current">Read this life’s story →</button><button class="btn" data-action="new-dialog">Begin another life</button>`:`<span class="timeline-tip">${s.pending?'Your life is paused for a decision.':playing?'Time is advancing. Events appear in your life record below.':'Press Play to advance through life.'}</span>`}</div></div></div>
 ${birthReveal?'':gameTabContent(s)}</section>
 <aside class="right-stack"><div class="panel panel-pad"><p class="panel-label">Your circumstances <span class="quiet">What you inherited and built</span></p>${dossierSmall(s)}</div>${peoplePanel(s)}<div class="panel panel-pad">${O.survivalHTML?.(s)||''}</div><div class="panel panel-pad"><p class="panel-label">Life and chance</p><p class="empty-note">Events, finances and people evolve in parallel. Not everything becomes a choice, and different starting circumstances change the opportunities available. The model is illustrative rather than statistically calibrated.</p><button class="disclosure" data-action="info">How realistic is the model? →</button></div></aside></div>
 ${ev&&!decisionAside&&!inspector?`<div class="decision-shade" role="presentation"><section class="decision-popup" role="dialog" aria-modal="true" aria-label="A life decision"><div class="decision-top"><span class="event-category">${safe(ev.category)} · Age ${s.age}</span><button class="btn btn-small" data-action="set-aside">Set aside ▾</button></div><h2 class="event-title">${safe(ev.title(s))}</h2><p class="event-copy">${safe(O.personalDecisionCopy?O.personalDecisionCopy(s,ev):ev.description(s))}</p>${contextualNote(O.contextForDecision?.(s,ev)||O.factForEvent(s,ev))}<div class="choice-list">${choices.map((c,i)=>`<button class="choice ${c.disabled?'unavailable':''}" data-action="choose" data-index="${i}" ${c.disabled?'disabled aria-disabled="true"':''}><div><strong>${safe(c.label)}</strong><span>${safe(c.detail)}</span></div><b class="arrow">${c.disabled?'—':'↗'}</b></button>`).join('')}</div><p class="event-subnote">Your choice matters, but personal circumstances and chance also shape the outcome.</p></section></div>`:''}
${inspectorView(s)}
 </main>`;
}
function archiveView(){let finished=archive;return `<main class="fade"><div class="page-heading"><div><p class="eyebrow">Your personal collection</p><h1>Life archive</h1><p class="small muted">Every saved life you have recorded is kept here. Select two completed lives to compare their starting conditions and outcomes.</p></div><div class="controls"><button class="btn" data-action="export">↓ Export backups</button><button class="btn" data-action="import">↑ Import</button>${compare.size===2?'<button class="btn btn-primary" data-action="compare">Compare selected →</button>':''}</div></div>${!finished.length?`<div class="panel archive-empty"><div class="symbol">◈</div><h2 class="section-title">A collection waiting to begin</h2><p>Finish or set aside a life and it will appear here with a complete journal, important relationships and milestone snapshots.</p><button class="btn btn-primary" data-action="new-dialog">Begin a life</button></div>`:`<div class="record-grid">${finished.map(s=>`<article class="record-card">${artCanvas(s.strata>=6?'mansion':'home',s)}<div class="body"><div class="eyebrow" style="margin-bottom:7px">${safe(s.country.name)} · ${s.birthYear}–${s.birthYear+s.age}</div><h3>${safe(s.name)}</h3><div class="badges">${pill(s)}<span class="tag">${s.status==='finished'?'Died age '+s.age:'Paused · Age '+s.age}</span></div><p class="summary">${safe(trim(s.journal.find(x=>x.type==='birth')?.description,130))}</p><div class="row"><button class="btn btn-small btn-primary" data-action="record" data-id="${safe(s.id)}">Read story →</button>${s.status==='paused'?`<button class="btn btn-small" data-action="resume-record" data-id="${safe(s.id)}">Resume</button>`:''}<label class="tiny muted" style="cursor:pointer"><input type="checkbox" data-compare="${safe(s.id)}" ${s.status!=='finished'?'disabled':''} ${compare.has(s.id)?'checked':''}> Compare</label></div></div></article>`).join('')}</div>`}<div class="notice" style="margin-top:22px">Archive entries are saved locally. They won't automatically sync across devices. Download a JSON backup regularly, particularly before changing browsers or clearing browser data. You can import that backup later.</div></main>`}
function lifeDetail(s){if(!s)return archiveView();const end=s.status==='finished';return `<main class="fade"><div class="page-heading"><div><p class="eyebrow">${end?'A completed life':'Life in progress'} · ${safe(s.country.name)}</p><h1>${safe(s.name)}</h1><p class="muted small">${s.birthYear}–${s.birthYear+s.age} · Age ${s.age} · ${safe(O.tier(s))}</p></div><div class="controls"><button class="btn" data-action="archive">← Back to archive</button><button class="btn" data-action="export-one" data-id="${safe(s.id)}">↓ Export this life</button>${end?`<button class="btn btn-danger btn-small" data-action="delete-prompt" data-id="${safe(s.id)}">Delete record</button>`:''}</div></div><div class="detail-content"><div class="left-stack"><div class="panel"><div class="game-scene">${artCanvas(s.strata>=6?'mansion':'home',s)}</div><div class="panel-pad"><h2 class="section-title">The story of ${safe(s.first)}</h2><p class="event-copy">${safe(s.birthDescription)}</p><div class="badges"><span class="tag">${safe(O.stage(s.age))}</span>${pill(s)}<span class="tag">${s.people.length} people encountered</span><span class="tag">${s.journal.length} events recorded</span></div></div></div><div class="panel panel-pad"><div class="chapter-tabs"><button class="btn btn-small ${chapter==='timeline'?'selected':''}" data-action="chapter" data-chapter="timeline">Full timeline</button><button class="btn btn-small ${chapter==='people'?'selected':''}" data-action="chapter" data-chapter="people">People & relationships</button><button class="btn btn-small ${chapter==='turns'?'selected':''}" data-action="chapter" data-chapter="turns">Revisit turning points</button></div>${chapter==='timeline'?`<div class="timeline">${s.journal.slice().reverse().map(e=>`<div class="time-item"><strong>Age ${e.age} · ${safe(O.cleanLogText(s,e.title))}</strong><em>${safe(O.cleanLogText(s,e.description))}</em></div>`).join('')}</div>`:chapter==='people'?`<div>${s.people.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><img class="avatar" src="${O.avatarData(p)}" width="39" height="39" alt=""><span class="person-meta"><strong>${safe(p.name)}</strong><span>${safe(p.role)} · ${p.age} yrs · ${safe(p.trait)} · ${p.alive?'Living':'Died'}</span></span><span class="bond">${p.close}%</span></button>`).join('')}</div>`:`<p class="small muted" style="line-height:1.7">Replay from a saved milestone to explore an alternative direction. This creates a new life record and preserves the original.</p>${s.snapshots.map(snap=>`<div class="log-entry"><span class="age">Age ${snap.age}</span><div class="text"><strong>${safe(snap.data.pending?O.EVENTS.find(e=>e.id===snap.data.pending)?.title(snap.data)||'Decision point':O.stage(snap.age))}</strong><div><button class="disclosure" data-action="fork" data-id="${safe(s.id)}" data-age="${snap.age}">Replay from this age →</button></div></div></div>`).join('')}`}</div></div><aside class="right-stack"><div class="panel panel-pad"><p class="panel-label">Life at a glance</p>${dossierSmall(s)}</div><div class="panel panel-pad"><p class="panel-label">Legacy</p><dl class="fact-list"><dt>Age reached</dt><dd>${s.age}</dd><dt>Years worked</dt><dd>${s.yearsWorked||0}</dd><dt>Children</dt><dd>${s.people.filter(x=>x.role==='Child').length}</dd><dt>Final well-being</dt><dd>${Math.round(s.happiness)}/100</dd><dt>Cause of death</dt><dd>${safe(s.cause||'—')}</dd></dl><p class="empty-note" style="margin-top:18px">There is no single score for a good life. Financial outcomes, relationships, health and meaning are not interchangeable.</p></div></aside></div></main>`}
function compareView(){const a=archive.find(x=>x.id===Array.from(compare)[0]),b=archive.find(x=>x.id===Array.from(compare)[1]);if(!a||!b)return archiveView();const rows=[['Birthplace',s=>s.country.name],['Family resource group',s=>O.tier(s)],['Childhood environment',s=>s.urban?'Urban':'Rural'],['Family annual income*',s=>O.money(s.familyIncome)],['Age at death',s=>''+s.age],['Final occupation',s=>s.job||'None'],['Qualifications',s=>s.education],['Years employed',s=>s.yearsWorked||0],['Children',s=>s.people.filter(p=>p.role==='Child').length],['Final cash*',s=>O.money(s.cash)],['Final debts*',s=>O.money(s.debt)],['Final net worth*',s=>O.money(O.netWorth(s))],['Final well-being',s=>`${Math.round(s.happiness)}/100`]];
return `<main class="fade"><div class="page-heading"><div><p class="eyebrow">Seeing beyond your own circumstances</p><h1>Two different lives</h1></div><button class="btn" data-action="archive">← Archive</button></div><div class="compare-cols">${[a,b].map(s=>`<div class="panel"><div class="game-scene">${artCanvas(s.strata>=6?'mansion':'home',s)}</div><div class="panel-pad"><h2 class="section-title">${safe(s.name)}</h2><p class="small muted">${safe(s.country.name)} · ${s.birthYear}–${s.birthYear+s.age}</p></div></div>`).join('')}</div><div class="panel panel-pad" style="margin-top:18px"><p class="panel-label">Circumstances and outcomes <span class="quiet">* Illustrative purchasing-power dollars</span></p>${rows.map(([name,fn])=>`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid #ecebe7;padding:12px 0;font-size:12px"><strong>${safe(fn(a))}</strong><span style="text-align:center;color:#7c867d">${safe(name)}</span><strong style="text-align:right">${safe(fn(b))}</strong></div>`).join('')}</div><div class="notice" style="margin-top:16px">These are two fictional outcomes from a simplified simulation. Differences cannot establish what caused success, hardship or early death. Use the comparison to ask questions, not to draw statistical conclusions.</div></main>`}
function modalView(){if(!modal)return '';let body='',heading='';if(modal.type==='new'){heading='Begin a new life';body=`<p class="description">A random country and family are drawn from an illustrative set of locations and demographic parameters. The default mode preserves the unpredictability of birth.</p><div class="form-row"><label>Where are you born?</label><select id="new-country"><option value="random">Surprise me · weighted random birth</option>${O.COUNTRIES.map(c=>`<option value="${c.code}">${safe(c.name)} · Authored culture</option>`).join('')}</select></div><div class="form-row"><label>Choose starting circumstances (optional)</label><select id="new-class"><option value="random">Fully random · normal distribution</option><option value="hardship">Explore severe hardship (bottom 8%)</option><option value="comfortable">Explore financial comfort (65th–85th percentile)</option><option value="top1">Explore the local top 1%</option></select></div><p class="tiny muted">Choosing a class or country is an exploration mode, not a statistically random global birth. A new life won't delete your finished archive.</p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="start">Be born →</button></div>`}
else if(modal.type==='person'){let p=modal.person;heading=p?.name||'Person';body=`${p?`<div class="identity-block" style="margin:10px 0 22px"><img class="avatar" src="${O.avatarData(p)}" width="82" height="82" alt=""><div><div class="name">${safe(p.role)}</div><div class="caption">Age ${p.age} · ${safe(p.trait)} · ${p.alive?'Alive':'Deceased'}</div></div></div><dl class="fact-list"><dt>Relationship</dt><dd>${safe(p.role)}</dd><dt>Closeness</dt><dd>${p.close}/100</dd><dt>Temperament</dt><dd>${safe(p.trait)}</dd><dt>Health index</dt><dd>${p.health}/100</dd><dt>Occupation</dt><dd>${safe(p.job)}</dd><dt>Whereabouts</dt><dd>${safe(p.residence||'Unknown')}</dd><dt>Annual earnings*</dt><dd>${O.money(p.annualIncome||0)}</dd></dl><p class="tiny muted">*Game purchasing-power equivalent, not a verified individual salary.</p><p class="description">This is a persistent fictional person. Their age, relationship with you and life circumstances may affect future events. Their inner experience is not reducible to a number.</p>`:''}<div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Close</button></div>`}
else if(modal.type==='people'){const s=modal.life;heading='The people you encountered';body=`${s.people.map(p=>`<button class="person-row" data-action="person" data-id="${safe(p.id)}"><img class="avatar" src="${O.avatarData(p)}" width="42" height="42" alt=""><span class="person-meta"><strong>${safe(O.profileLabel(p))}</strong><span>${safe(p.role)} · Age ${p.age} · ${p.alive?'Living':'Died'}</span></span><span class="bond">${p.close}%</span></button>`).join('')}<div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>`}
else if(modal.type==='info'){heading='How the simulation works';body=`<p class="description">Other Lives is an original, text-based fictional life simulator. Birthplace, household percentile and chance shape starting circumstances. The clock runs automatically, generating ordinary life events and pausing for consequential decisions. Your choices change health, learning, relationships, finances and future events.</p><div class="help-grid"><div class="feature"><h3>${O.COUNTRIES.length} countries / regions</h3><p>Worldwide country selection. Statistical quality differs substantially across countries.</p></div><div class="feature"><h3>Partial calibration</h3><p>UNICEF 2024 under-five survival and World Bank 2024 life expectancy anchor selected countries. The age-specific adult curve and personal risk adjustments remain modelled estimates.</p></div><div class="feature"><h3>Economic differences</h3><p>Household class, adult savings, debts and opportunity interact. Money is stored in shared purchasing-power units. GBP is the default display; USD, HKD and EUR are optional. Fixed game display scales (GBP 0.75, USD 1, HKD 7.8, EUR 0.9 per unit) are conventions, not live exchange rates or verified local wages.</p></div><div class="feature"><h3>Life archives</h3><p>Saved locally in your browser; unfinished lives can be resumed, and JSON backups protect your archive.</p></div></div><p class="description">Research starting points: <a href="https://population.un.org/wpp/" target="_blank" rel="noopener">UN World Population Prospects</a>, <a href="https://data.worldbank.org/" target="_blank" rel="noopener">World Bank</a>, <a href="https://ilostat.ilo.org/" target="_blank" rel="noopener">ILOSTAT</a> and <a href="https://www.who.int/data/gho" target="_blank" rel="noopener">WHO</a>. The current code does not import their complete datasets or claim event rates are verified. Outcomes are stories, not predictions or causal estimates.</p><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Understood</button></div>`}
else if(modal.type==='delete'){heading='Delete this life?';body=`<p class="description">This permanently deletes the selected archive record from this browser. Export a backup first if you might want to revisit it.</p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="delete" data-id="${safe(modal.id)}">Delete life</button></div>`}
return `<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${safe(heading)}"><div class="modal-head"><h2>${safe(heading)}</h2><button class="btn btn-small" data-action="close-modal" aria-label="Close">✕</button></div>${body}</section></div>`}
function drawBirthRoulette(){
 if(!birthReveal||birthRouletteFinished||birthRouletteTimer||view!=='game')return;
 const tick=()=>{
  if(!birthReveal||view!=='game'){clearInterval(birthRouletteTimer);birthRouletteTimer=null;return;}
  if(performance.now()-birthRevealStarted>=1400){clearInterval(birthRouletteTimer);birthRouletteTimer=null;birthRouletteFinished=true;render();return;}
  // Read the current nodes: another render must not strand the animation on detached nodes.
  const line=document.querySelector('.birth-rolling'),face=document.querySelector('.birth-reveal h2');if(!line||!face)return;
  const place=O.COUNTRIES[Math.floor(Math.random()*O.COUNTRIES.length)];
  line.textContent='Searching across the world · '+place.name;
  const pool=O.POOLS[place.region];face.textContent=pool?pool.firstF[Math.floor(Math.random()*pool.firstF.length)]+' …':'A life begins …';
 };
 birthRouletteTimer=setInterval(tick,100);
};
function render(){const y=window.scrollY||0;const content=view==='landing'?landing():view==='game'?game():view==='archive'?archiveView():view==='detail'?lifeDetail(detailId==='current'?state:archive.find(x=>x.id===detailId)):view==='compare'?compareView():landing();root.innerHTML=base(content);renderArt();drawBirthRoulette();if(view==='game'&&!state?.pending)window.scrollTo(0,y)}
function stopClock(){playing=false;if(clockTimer){clearInterval(clockTimer);clockTimer=null;}monthBank=0;}
function startClock(){if(!state||state.status!=='alive'||state.pending||inspector||modal||birthReveal||gameTab!=='log')return;stopClock();playing=true;lastPulse=performance.now();clockTimer=setInterval(tickClock,85)}
function syncTime(){const bar=$('#month-fill');if(bar)bar.style.width=(state.month/12*100)+'%';const visible=$('.time-label');if(visible)visible.textContent=`Age ${state.age} · ${state.month+1}/12`;const label=$('#live-age');if(label)label.textContent=`· Age ${state.age} · Month ${state.month+1}`}
function tickClock(){if(!state||state.status!=='alive'||view!=='game'){stopClock();return}if(state.pending){resumeAfterDecision=true;stopClock();render();return}
 const now=performance.now(),dt=Math.max(0,Math.min(700,now-lastPulse));lastPulse=now;monthBank+=dt*clockSpeed/3750;
 let n=0,draw=false;
 while(monthBank>=1&&n++<8&&state.status==='alive'&&!state.pending){monthBank-=1;const r=O.advanceMonth(state);if(r.entry||r.birthday||r.finished)draw=true;if(r.decision){if(autoChoices){const e=O.EVENTS.find(x=>x.id===state.pending);if(e){{const valid=e.options(state).map((c,i)=>c.disabled?null:i).filter(i=>i!==null);if(valid.length)O.applyChoice(state,O.pick(state,valid));}draw=true}}else{resumeAfterDecision=true;stopClock();draw=true;break}}}
 if(n>0){saveCurrent();if(state.status==='finished'){stopClock();persistFinished();draw=true}if(draw)render();else syncTime()}
}
async function persistFinished(){if(state?.status==='finished'){const ok=await putArchive(state);await refreshArchive();if(!ok)notify('Could not archive this life. Export a backup immediately.')}}
function backupDownload(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function selectedLife(){return view==='detail'?(detailId==='current'?state:archive.find(x=>x.id===detailId)):state}
async function handle(action,el){switch(action){
 case 'home':stopClock();resumeAfterInspector=false;view='landing';break;
 case 'resume':stopClock();view='game';if(state?.status==='alive'&&!state.pending)startClock();break;
 case 'archive':stopClock();resumeAfterInspector=false;await refreshArchive();view='archive';break;
 case 'new-dialog':stopClock();modal={type:'new'};break;
 case 'info':modal={type:'info'};break;
 case 'close-modal':modal=null;if(resumeAfterInspector&&!inspector&&!state?.pending&&state?.status==='alive'){resumeAfterInspector=false;startClock()}break;
 case 'start':{if(birthRouletteTimer)clearInterval(birthRouletteTimer);birthRouletteTimer=null;decisionAside=false;inspector=null;resumeAfterInspector=false;const country=$('#new-country')?.value||'random',classChoice=$('#new-class')?.value||'random';stopClock();if(state?.status==='alive'){await putArchive({...state,status:'paused'});await refreshArchive()}state=O.create({country,classChoice,draw:'birth',year:2026});saveCurrent();view='game';modal=null;logCount=10;chapter='timeline';gameTab='log';tabResume=false;birthReveal=true;birthRouletteFinished=false;birthRevealStarted=performance.now();stopClock();break}
 case 'choose':{if(!state||!state.pending)return;decisionAside=false;inspector=null;state.lastEventTitle=O.EVENTS.find(x=>x.id===state.pending)?.title(state);const resolved=O.applyChoice(state,Number(el.dataset.index));if(!resolved){notify('This option is unavailable for your current circumstances.');break}saveCurrent();if(resumeAfterDecision){resumeAfterDecision=false;startClock()}break}
 case 'set-aside':decisionAside=true;break;
  case 'return-decision':decisionAside=false;inspector=null;break;
  case 'plan-action':{if(!state)return;const result=O.planAction(state,el.dataset.id);notify(result.message);saveCurrent();gameTab='spend';break;}
 case 'buy':{if(!state||typeof O.buy!=='function')return;const result=O.buy(state,el.dataset.id);notify(result.message);saveCurrent();gameTab='spend';break;}
  case 'game-tab':{
   const target=el.dataset.tab||'log';
   if(target!==gameTab){
      if(target!=='log'){if(playing){tabResume=true;stopClock()}} 
      else if(gameTab!=='log'&&tabResume&&!state?.pending&&!decisionAside){tabResume=false;gameTab='log';startClock();break}
      gameTab=target;
   }
   break;
 }
 case 'inspector':if(playing){resumeAfterInspector=true;stopClock()}decisionAside=!!state?.pending;inspector=el.dataset.tab||'profile';break;
  case 'close-inspector':inspector=null;if(resumeAfterInspector&&!state?.pending&&state?.status==='alive'){resumeAfterInspector=false;startClock()}break;
  case 'next-decision':{if(!state||state.pending||state.status!=='alive')return;stopClock();resumeAfterDecision=true;O.skipToDecision(state);saveCurrent();if(state.status==='finished')await persistFinished();break}
 
 case 'dismiss-birth':if(!birthRouletteFinished)break;birthReveal=false;birthRouletteFinished=true;if(birthRouletteTimer)clearInterval(birthRouletteTimer);birthRouletteTimer=null;startClock();break;
 case 'play-pause':if(playing)stopClock();else{gameTab='log';inspector=null;modal=null;tabResume=false;if(state?.pending){decisionAside=false;resumeAfterDecision=true;}else startClock();}break;
 case 'search-work':{if(!state)return;const result=O.startJobSearch(state,el.dataset.mode);notify(result.message);saveCurrent();break;}
 case 'speed':clockSpeed=Number(el.dataset.value)||4;break;
 case 'more-log':logCount+=15;break;
 case 'person':{if(playing){resumeAfterInspector=true;stopClock()}const life=selectedLife();const person=life?.people.find(p=>p.id===el.dataset.id);if(person)modal={type:'person',person};break}
 case 'all-people':modal={type:'people',life:state};break;
 case 'record':view='detail';detailId=el.dataset.id;chapter='timeline';break;
 case 'resume-record':{const saved=archive.find(x=>x.id===el.dataset.id);if(!saved||saved.status!=='paused')break;if(state?.status==='alive'&&state.id!==saved.id)await putArchive({...state,status:'paused'});state=JSON.parse(JSON.stringify(saved));O.ensureTimeline(state);state.status='alive';await deleteArchive(saved.id);await refreshArchive();saveCurrent();view='game';chapter='timeline';if(!state.pending)startClock();break}
 case 'detail-current':view='detail';detailId='current';chapter='timeline';await persistFinished();break;
 case 'chapter':chapter=el.dataset.chapter;break;
 case 'compare':if(compare.size===2)view='compare';break;
 case 'export':backupDownload({format:'other-lives-backup-v1',date:new Date().toISOString(),current:state,lives:archive},`other-lives-backup-${new Date().toISOString().slice(0,10)}.json`);notify('Backup downloaded. Keep it somewhere safe.');break;
 case 'export-one':{const life=archive.find(s=>s.id===el.dataset.id)||state;if(life)backupDownload({format:'other-lives-life-v1',life},`other-lives-${life.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`);break}
 case 'import':$('#import-file').click();break;
 case 'delete-prompt':modal={type:'delete',id:el.dataset.id};break;
 case 'delete':{await deleteArchive(el.dataset.id);compare.delete(el.dataset.id);await refreshArchive();modal=null;view='archive';notify('Record deleted from this browser.');break}
 case 'fork':{if(state?.status==='alive'){await putArchive({...state,status:'paused'});await refreshArchive()}const from=archive.find(x=>x.id===el.dataset.id)||state;const snap=from?.snapshots.find(x=>x.age===Number(el.dataset.age));if(!snap)return;const ns=JSON.parse(JSON.stringify(snap.data));ns.id='life-'+Date.now()+'-'+Math.floor(Math.random()*100000);ns.snapshots=[];ns.startedAt=new Date().toISOString();ns.finishedAt=null;ns.status='alive';ns.cause=null;ns.lastOutcome='';O.journal(ns,'Another possible path','You have restarted from an earlier turning point. The original life is preserved in the archive.','life');O.ensureTimeline(ns);state=ns;saveCurrent();view='game';chapter='timeline';if(!state.pending)startClock();notify('Alternate life created. Your original remains safe.');break}
 }render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopClock();saveCurrent();render();}});
root.addEventListener('click',async ev=>{let btn=ev.target.closest('[data-action]');if(btn){ev.preventDefault();try{await handle(btn.dataset.action,btn)}catch(e){console.error(e);notify('An unexpected error occurred. You can export a backup from the archive.')}return}if(ev.target.id==='inspector-shade'){inspector=null;if(resumeAfterInspector&&!state?.pending&&state?.status==='alive'){resumeAfterInspector=false;startClock()}render();return}if(ev.target.id==='modal-backdrop'){modal=null;render()}});
root.addEventListener('change',e=>{if(e.target.dataset.change==='currency'){O.setCurrency(e.target.value);render();return;}if(e.target.dataset.change==='autodecide'){autoChoices=e.target.checked;if(autoChoices&&state?.pending){const ev=O.EVENTS.find(x=>x.id===state.pending);if(ev){{const valid=ev.options(state).map((c,i)=>c.disabled?null:i).filter(i=>i!==null);if(valid.length)O.applyChoice(state,O.pick(state,valid));}saveCurrent();startClock();render();}}return;}if(e.target.dataset.change==='focus'&&state){state.focus=e.target.value;saveCurrent()}else if(e.target.dataset.compare){if(e.target.checked){if(compare.size===2){e.target.checked=false;notify('Select only two lives at a time.');return}compare.add(e.target.dataset.compare)}else compare.delete(e.target.dataset.compare);render()}});
const fileInput=document.createElement('input');fileInput.type='file';fileInput.id='import-file';fileInput.accept='.json,application/json';fileInput.hidden=true;document.body.appendChild(fileInput);
fileInput.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const lives=data.format==='other-lives-life-v1'?[data.life]:data.format==='other-lives-backup-v1'?data.lives:[];if(!lives||!Array.isArray(lives))throw Error('Invalid format');let n=0;for(const s of lives){if(s&&s.id&&s.country&&Array.isArray(s.journal)&&['finished','paused'].includes(s.status)){await putArchive(s);n++}}if(data.current&&data.current.id&&data.current.country&&(!state||confirm('Replace the current in-progress life with the one in this backup?'))){state=data.current;saveCurrent()}await refreshArchive();view='archive';render();notify(`Imported ${n} archived ${plural(n,'life','lives')}.`)}catch(err){notify('Could not read this backup. Check that it is an Other Lives JSON file.')}fileInput.value=''});

window.addEventListener('other-lives-ready',()=>{if(state)O.ensureClarity(state);render()});

<script>
/* V2.5: persistent, context-sensitive character life events. All fictional narratives,
   not assertions that demographic identity causes a personal outcome. */
(function(O){
 const OLD=O.pickStories;
 O.pickStories=function(s,n){
  const out=OLD(s,n); const id=s.country.code; const age=s.age;
  if(n&&age>=3&&age<=90){
   if(!s.flags.personalThread)s.flags.personalThread=O.pick(s,['books','sport','music','drawing','animals','technology']);
   const thread=s.flags.personalThread, people=(s.people||[]).filter(p=>p.alive);
   const mother=people.find(p=>p.role==='Mother');const father=people.find(p=>p.role==='Father');
   const guardian=mother||father||people[0];
   const who=guardian?O.personLabel(guardian):'a family member';
   let custom=null;
   if(age>=5&&age<16&&s.school&&O.chance(s,.30)){
    const subject=thread==='sport'?'physical education':thread==='music'?'music':thread==='technology'?'computing':thread==='drawing'?'art':'history';
    const teacherNames={GH:['Ms. Mensah','Mr. Boateng'],HK:['Ms. Chan','Mr. Wong'],BD:['Mr. Rahman','Ms. Akter'],GB:['Ms. Smith','Mr. Taylor'],IN:['Ms. Das','Mr. Sharma'],NG:['Mr. Okafor','Ms. Adebayo'],ET:['Ms. Bekele','Mr. Tesfaye']};const teacher=s.flags.favouriteTeacher||O.pick(s,teacherNames[id]||['Ms. Taylor','Mr. Lee']);
    s.flags.favouriteTeacher=teacher;
    custom={title:`${teacher} notices your interest`,description:`Your ${subject} teacher, ${teacher}, notices how much attention you pay. A short conversation leaves you feeling seen. ${who} asks what made you so cheerful when you return home.`,scene:'school',effect:'thread-encouragement'};
    s.flags.teacherMemory=age;
   } else if(s.flags.teacherMemory&&age-s.flags.teacherMemory>=4&&!s.flags.teacherReflection&&O.chance(s,.26)){
    custom={title:'A voice you remember',description:`You remember how ${s.flags.favouriteTeacher||'a teacher'} once encouraged your interest in ${thread}. That small moment comes back as you think about the next stage of life.`,scene:'home',effect:'thread-reflection'};
    s.flags.teacherReflection=true;
   } else if(age>=10&&O.chance(s,.19)){
    const examples={GH:[`A tro-tro fare increase changes how your household plans travel. ${who} explains what must wait until the next pay day.`,`At a neighbourhood gathering, talk turns to school costs and work. You notice adults have different ideas about opportunity.`],HK:[`Your household compares public transport routes and rising housing costs. ${who} discusses how little space can shape daily routines.`,`A classmate talks about tutorials and school places. You compare experiences without assuming every family can afford the same support.`],BD:[`Seasonal rain changes the trip to school or market. ${who} worries about lost work time.`,`At a local bazaar, you hear adults comparing prices, debt and ways to manage household expenses.`],GB:[`A teacher describes different routes through GCSEs, sixth form, apprenticeships and college. ${who} asks what appeals to you.`,`A family conversation turns to housing costs and the possibility of moving farther from work.`],NG:[`A neighbour discusses fuel and transport expenses. ${who} adjusts the household budget.`,`A schoolfriend tells you about different exam and vocational routes, opening a new line of thought.`],IN:[`Your household plans around education fees, travel distance and exam options. ${who} shares their hopes.`,`You overhear a conversation about moving cities for work and the relatives who have already left.`],ET:[`Rainfall affects daily plans for some neighbours. ${who} talks about what that means for supplies.`,`You hear adults discuss community savings and how local networks can help during a difficult season.`]};
    const pool=examples[id];if(pool)custom={title:({GH:'Fares and family budgets',HK:'Daily life in Hong Kong',BD:'Seasonal routines and prices',GB:'Choices closer to home',NG:'Life in the neighbourhood',IN:'Costs and opportunities',ET:'Community and seasons'})[id],description:O.pick(s,pool),scene:'city',effect:'local-'+id};
   }
   if(custom)out[O.int(s,0,out.length-1)]=custom;
  }
  return out;
 };
 const prevFire=O.fireStory;
 O.fireStory=function(s,item){prevFire(s,item);if(item.effect==='thread-encouragement')O.adjust(s,{knowledge:2,happiness:2});};
})(window.OL);
</script>
<script>
/* v5.3 - age, finance and family-role coherence audit. */
(function(O){
 const originalJournal=O.journal;
 O.cleanLogText=function(s,text){
  let v=String(text??'');
  // Older archived journals are cleaned at display-time, without modifying saved files.
  for(const p of s.people||[]){
   const role=O.parentRole?O.parentRole(p):p.role;
   const label=role==='Mother'?'Mom':role==='Father'?'Dad':p.name;
   for(const name of [p.name,p.name.split(' ')[0]].filter(Boolean)){
     for(const prefix of [role,role.toLowerCase(),role==='Mother'?'Mom':role==='Father'?'Dad':'']){
       if(prefix)v=v.split(prefix+' ('+name+')').join(label);
     }
   }
  }
  v=v.replace(/\b(?:Mom|Dad|Mother|Father|Parent)\s*\([^)]{1,80}\)/gi,m=>/mom|mother/i.test(m)?'Mom':'Dad');
  v=v.replace(/\b(?:Friend|Partner|Sibling|Grandparent|Mentor|Child)\s*\(([^)]{1,80})\)/gi,(_m,name)=>name);
  return v;
 };
 O.journal=function(s,title,description,type){return originalJournal(s,O.cleanLogText(s,title),O.cleanLogText(s,description),type)};
 const event=(id)=>O.EVENTS.find(e=>e.id===id);
 const hardship=event('food-insecurity'); if(hardship)hardship.min=18;
 const schooling=event('school-costs'); if(schooling)schooling.min=13;
 const health=event('parent-health');if(health){
   health.min=12;
   const opts=health.options;
   health.options=s=>s.age<18?[
     {label:'Help at home where you can',detail:'Small practical acts while adults arrange healthcare.',apply:st=>{O.adjust(st,{relationships:3,stress:2});O.bond(st,'Parent',3);return 'You help with chores or keep a parent company while the adults arrange care.'}},
     {label:'Talk to another trusted adult',detail:'Ask an older relative, teacher or community member for support.',apply:st=>{O.adjust(st,{knowledge:2,stress:-1});return 'You ask for help. The situation is still uncertain, but you no longer have to carry every worry alone.'}},
     {label:'Keep some time for school or friends',detail:'Your wellbeing matters even when the household is under pressure.',apply:st=>{O.adjust(st,{happiness:2,stress:-2});return 'You keep part of your routine while your family organises the practical decisions.'}}
   ]:opts(s);
 }
 const vaccine=event('childhood-immunisation');if(vaccine)vaccine.when=()=>false;
 const scholarship=event('scholarship');if(scholarship){
  const oldOptions=scholarship.options;
  scholarship.options=s=>oldOptions(s).map((option,i)=>i===0?{...option,apply:st=>{const odds=.20+st.knowledge/260+(st.school?.1:0);if(O.chance(st,odds)){
   st.flags.studying=true;st.flags.graduationAge=st.age+Math.max(2,O.int(st,2,4));O.adjust(st,{knowledge:4,happiness:5});return 'You secure educational support and begin a programme. Completing the qualification will still take years.';}
   O.adjust(st,{stress:2});return 'You are not selected this time. You can continue looking for suitable opportunities.';}}:option);
 }
 const schoolEntry=event('school-entry');if(schoolEntry){
   schoolEntry.title=()=> 'Starting school: a family decision';
   schoolEntry.description=s=>`Caregivers consider the available schools and travel costs in ${s.country.name}. You can tell them what makes you curious or worried, but adults and school authorities make the enrolment arrangements.`;
   schoolEntry.options=s=>[
    {label:'Tell your family you want to attend school',detail:'Your wishes matter, but the adults have to organise enrolment and transport.',apply:st=>{const chance=Math.min(.98,.38+st.country.school/190+st.strata*.025);if(O.chance(st,chance)){st.school=true;O.adjust(st,{knowledge:7});return 'Your caregivers arrange for you to begin school.';}return 'Your family tries, but practical obstacles delay attendance.'}},
    {label:'Learn with family and community for now',detail:'Knowledge can grow outside school, but formal opportunities may be limited.',apply:st=>{O.adjust(st,{knowledge:3,relationships:2});return 'Your family teaches you useful things at home while exploring school access.'}},
    ...(s.strata>=5?[{label:'Ask about additional tutoring',detail:'Your family may be able to pay for extra support.',apply:st=>{st.school=true;O.adjust(st,{knowledge:9});return 'Your caregivers arrange extra help alongside school.'}}]:[])
   ];
 }
 const wasPassive=O.passive;
 O.passive=function(s){
   wasPassive(s);
   if(s.flags.vocationalEnrolled&&s.age>=s.flags.vocationalGraduationAge){s.flags.vocationalEnrolled=false;s.education=O.EDU[3];O.adjust(s,{knowledge:7,confidence:4});O.journal(s,'Vocational training completed','You complete a period of practical training. The qualification or experience improves some opportunities, but does not guarantee a job.','education');}
   if(s.age===1&&!s.flags.vaccineChoiceMade){
     const coverage=Math.max(.18,Math.min(.96,.30+(s.country.infra||40)/160+s.strata*.025));
     const offered=O.chance(s,coverage);s.flags.vaccineChoiceMade=true;s.flags.vaccinationMissed=!offered;
     O.journal(s,'Early childhood healthcare',offered?'Your caregivers are able to arrange routine childhood immunisations. Access depends on local services, travel and family circumstances.':'Some recommended childhood vaccinations are delayed or unavailable to your family. Adults continue seeking healthcare where possible.','health');
   }
 };
})(window.OL);
</script>
